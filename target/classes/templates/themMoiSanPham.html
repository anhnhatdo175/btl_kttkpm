<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm mới sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar">
        <span class="navbar-brand">Thêm mới sản phẩm</span>
        <a th:href="@{/goodsReceipt/searchProduct}" class="btn btn-outline-light btn-sm">Quay lại</a>
    </div>
    <div class="container">
        <div class="box" style="max-width:500px;margin:20px auto;">
            <div class="box-header bg-success">Thêm mới sản phẩm</div>
            <div class="box-body">
                <form th:action="@{/goodsReceipt/saveProduct}" method="post" th:object="${product}">
                    <div class="form-group"><label>Tên sản phẩm</label><input type="text" th:field="*{name}" required></div>
                    <div class="form-group"><label>Barcode</label><input type="text" th:field="*{barcode}" required></div>
                    <div class="form-group"><label>Giá bán lẻ dự kiến</label><input type="number" th:field="*{price}" min="0" step="1000" required></div>
                    <button type="submit" class="btn btn-success">Lưu sản phẩm</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
