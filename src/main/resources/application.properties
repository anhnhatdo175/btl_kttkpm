# ===== MySQL Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/supermarket_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Giữ nguyên tên trường camelCase như trong báo cáo thiết kế
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Server =====
server.port=8080

# ===== Khởi tạo dữ liệu =====
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
