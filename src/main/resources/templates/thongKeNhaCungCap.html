<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê nhà cung cấp theo lượng hàng nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar bg-success">
        <span class="navbar-brand">Thống kê nhà cung cấp</span>
        <a th:href="@{/tuyChonBaoCao}" class="btn btn-outline-light btn-sm">Quay lại</a>
    </div>
    <div class="container">
        <h3 class="page-title">Thống kê nhà cung cấp theo lượng hàng nhập</h3>
        <!-- Form chọn khoảng thời gian -->
        <div class="box">
            <div class="box-body">
                <form th:action="@{/statistics/suppliers}" method="get" class="search-form">
                    <div class="form-group" style="flex:1"><label>Từ ngày</label>
                        <input type="date" name="fromDate" th:value="${fromDate != null ? #dates.format(fromDate, 'yyyy-MM-dd') : ''}">
                    </div>
                    <div class="form-group" style="flex:1"><label>Đến ngày</label>
                        <input type="date" name="toDate" th:value="${toDate != null ? #dates.format(toDate, 'yyyy-MM-dd') : ''}">
                    </div>
                    <div style="display:flex;align-items:flex-end;"><button type="submit" class="btn btn-success">Thống kê</button></div>
                </form>
            </div>
        </div>
        <!-- Bảng thống kê -->
        <table>
            <thead>
                <tr><th>Mã nhà cung cấp</th><th>Tên nhà cung cấp</th><th>Tổng số lượng hàng nhập</th><th>Thao tác</th></tr>
            </thead>
            <tbody>
                <tr th:each="stat : ${stats}">
                    <td th:text="${stat.id}"></td>
                    <td th:text="${stat.name}"></td>
                    <td th:text="${stat.totalImportQuantity}"></td>
                    <td>
                        <a th:href="@{/statistics/suppliers/detail(id=${stat.id}, fromDate=${#dates.format(fromDate, 'yyyy-MM-dd')}, toDate=${#dates.format(toDate, 'yyyy-MM-dd')})}" class="btn btn-info btn-sm">Xem chi tiết</a>
                    </td>
                </tr>
                <tr th:if="${stats == null || stats.isEmpty()}">
                    <td colspan="4" class="text-center text-muted">Không có dữ liệu. Vui lòng chọn khoảng thời gian và nhấn "Thống kê".</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
