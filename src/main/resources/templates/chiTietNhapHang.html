<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết nhập hàng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="navbar">
        <span class="navbar-brand">Chi tiết nhập hàng</span>
        <a th:href="@{/goodsReceipt/searchProduct}" class="btn btn-outline-light btn-sm">Quay lại</a>
    </div>
    <div class="container">
        <div class="box" style="max-width:500px;margin:20px auto;">
            <div class="box-header bg-info">Nhập chi tiết cho sản phẩm: <span th:text="${product.name}"></span></div>
            <div class="box-body">
                <form th:action="@{/goodsReceipt/addItem}" method="post">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <div class="form-group"><label>Tên sản phẩm</label><input type="text" th:value="${product.name}" readonly></div>
                    <div class="form-group"><label>Mã vạch</label><input type="text" th:value="${product.barcode}" readonly></div>
                    <div class="form-group"><label>Số lượng nhập</label><input type="number" name="quantity" min="1" required></div>
                    <div class="form-group"><label>Giá nhập</label><input type="number" name="priceImport" min="0" step="1000" required></div>
                    <button type="submit" class="btn btn-primary">Thêm vào phiếu</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
